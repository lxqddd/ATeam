packages:
  - apps/*
  - packages/*

# electron-builder 26.18 declares @electron/get ^3 but uses the v5 cache API.
overrides:
  "app-builder-lib>@electron/get": "^5.1.0"

allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: false

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.13'
  - '@turbo/darwin-arm64@2.11.13'
  - '@turbo/linux-64@2.11.13'
  - '@turbo/linux-arm64@2.11.13'
  - '@turbo/windows-64@2.11.13'
  - '@turbo/windows-arm64@2.11.13'
  - electron@45.4.1
  - turbo@2.11.13
  - i18next@27.2.1
  - react-i18next@18.0.3
