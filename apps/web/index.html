<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*"
    />
    <script>
      ;(() => {
        try {
          const key = 'ateam.theme'
          const pref = localStorage.getItem(key) || 'light'
          const ids = ['light', 'dark', 'sunset', 'ink', 'graphite', 'cream', 'mist']
          const resolved =
            pref === 'system'
              ? matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : pref
          const theme = ids.includes(resolved) ? resolved : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.themePref = pref
          document.documentElement.style.colorScheme = ['dark', 'ink', 'graphite'].includes(theme)
            ? 'dark'
            : 'light'
        } catch {
          /* ignore */
        }
      })()
    </script>
    <title>ATeam</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
