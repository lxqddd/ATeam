name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it."
            exit 0
          fi
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "ATeam $GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease

  package:
    name: Package (${{ matrix.os }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build headless and client SDK
        run: |
          pnpm --filter @ateam/headless build
          pnpm --filter @ateam/client-sdk build

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          expected="v$version"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version" >&2
            exit 1
          fi

      - name: Build unpacked application
        run: pnpm --filter @ateam/desktop build:unpack

      - name: Archive macOS application
        if: runner.os == 'macOS'
        working-directory: apps/desktop/dist
        run: ditto -c -k --keepParent mac*/ATeam.app ATeam-mac.zip

      - name: Archive Linux application
        if: runner.os == 'Linux'
        working-directory: apps/desktop/dist
        run: tar -czf ATeam-linux.tar.gz linux-unpacked

      - name: Archive Windows application
        if: runner.os == 'Windows'
        working-directory: apps/desktop/dist
        shell: pwsh
        run: Compress-Archive -Path win-unpacked -DestinationPath ATeam-win.zip

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Smoke test packaged application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @ateam/desktop smoke:packaged

      - name: Smoke test packaged application
        if: runner.os != 'Linux'
        run: pnpm --filter @ateam/desktop smoke:packaged

      - name: Build macOS installer
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: pnpm --filter @ateam/desktop exec electron-builder --mac

      - name: Build macOS x64 installer
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: pnpm --filter @ateam/desktop exec electron-builder --mac --x64

      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        run: pnpm --filter @ateam/desktop exec electron-builder --win

      - name: Build Linux installers
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: pnpm --filter @ateam/desktop exec electron-builder --linux AppImage deb

      - name: Upload packages to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=()
          for pattern in 'dist/*.dmg' 'dist/*.zip' 'dist/*.tar.gz' 'dist/*.exe' 'dist/*.AppImage' 'dist/*.deb'; do
            for file in $pattern; do
              if [ -f "$file" ]; then files+=("$file"); fi
            done
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release files were produced." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  finalize-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            *-*) gh release edit "$GITHUB_REF_NAME" --draft=false ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false --latest ;;
          esac
