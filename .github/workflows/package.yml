name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          expected="v$version"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version" >&2
            exit 1
          fi

      - name: Build unpacked application
        run: pnpm --filter @ateam/desktop build:unpack

      - name: Archive macOS application
        if: runner.os == 'macOS'
        working-directory: apps/desktop/dist
        run: ditto -c -k --keepParent mac*/ATeam.app ATeam-mac.zip

      - name: Archive Linux application
        if: runner.os == 'Linux'
        working-directory: apps/desktop/dist
        run: tar -czf ATeam-linux.tar.gz linux-unpacked

      - name: Archive Windows application
        if: runner.os == 'Windows'
        working-directory: apps/desktop/dist
        shell: pwsh
        run: Compress-Archive -Path win-unpacked -DestinationPath ATeam-win.zip

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Smoke test packaged application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @ateam/desktop smoke:packaged

      - name: Smoke test packaged application
        if: runner.os != 'Linux'
        run: pnpm --filter @ateam/desktop smoke:packaged

      - name: Build macOS installer
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: pnpm --filter @ateam/desktop exec electron-builder --mac

      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        run: pnpm --filter @ateam/desktop exec electron-builder --win

      - name: Build Linux installers
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: pnpm --filter @ateam/desktop exec electron-builder --linux AppImage deb

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ateam-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.tar.gz
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: warn

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ateam-*
          merge-multiple: true
          path: release-assets

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            prerelease=""
            case "$GITHUB_REF_NAME" in
              *-*) prerelease="--prerelease" ;;
            esac
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "ATeam $GITHUB_REF_NAME" \
              --generate-notes \
              $prerelease
          fi
