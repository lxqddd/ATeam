name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race $(go list ./... | grep -v '/apps/desktop')
      - run: go vet $(go list ./... | grep -v '/apps/desktop')
      - name: Core coverage at least 70%
        run: |
          go test -cover ./internal/store ./internal/scheduler ./internal/workspace ./internal/runtime ./internal/api | tee /tmp/cover.txt
          grep -oE 'coverage: [0-9.]+%' /tmp/cover.txt | sed 's/coverage: //; s/%//' | awk '$1 < 70 { print "below 70%: " $1; bad=1 } END { exit bad ? 1 : 0 }'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @ateam/web check:i18n
      - run: pnpm --filter @ateam/web build
