name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26.4.0
  PNPM_VERSION: 11.9.0

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  kernel:
    name: Kernel (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm opencode:build
      - name: Verify checksums
        working-directory: apps/desktop/resources/opencode
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ateam-kernel-linux-x64
          path: |
            apps/desktop/resources/opencode/opencode
            apps/desktop/resources/opencode/SHA256SUMS
          if-no-files-found: error

  kernel-macos:
    name: Kernel (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm opencode:build
      - name: Verify checksums
        working-directory: apps/desktop/resources/opencode
        run: shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ateam-kernel-darwin-arm64
          path: |
            apps/desktop/resources/opencode/opencode
            apps/desktop/resources/opencode/SHA256SUMS
          if-no-files-found: error
